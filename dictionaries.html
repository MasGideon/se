<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Projects - Dictionaries Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #334155;
            --primary-hover: #0f172a;
            --bg: #f1f5f9;
            --sidebar-bg: #0f172a;
            --sidebar-text: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --error: #ef4444;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width:280px; background-color:var(--sidebar-bg); color:var(--sidebar-text); display:flex; flex-direction:column; padding:1.5rem; position:fixed; height:100vh; overflow-y:auto; }
        .sidebar h2 { font-family:'Outfit', sans-serif; font-size:1.5rem; margin-bottom:2rem; color:#fff; display:flex; align-items:center; gap:10px; }
        .sidebar h2::before { content: '📖'; }
        .nav-list { list-style:none; }
        .nav-item { padding:0.75rem 1rem; margin-bottom:0.4rem; border-radius:8px; cursor:pointer; transition:all 0.2s; font-size:0.9rem; color:#94a3b8; }
        .nav-item:hover { background-color:rgba(255,255,255,0.1); color:#fff; }
        .nav-item.active { background-color:var(--primary); color:#fff; font-weight:600; }
        .main-content { flex:1; margin-left:280px; padding:3rem; display:flex; flex-direction:column; align-items:center; }
        .container { max-width:800px; width:100%; }
        .header { margin-bottom:2rem; width:100%; }
        .header h1 { font-family:'Outfit', sans-serif; font-size:2.2rem; }
        .card { background:var(--card-bg); padding:2rem; border-radius:16px; box-shadow:var(--shadow); border:1px solid var(--border); width:100%; }
        .input-group { margin-bottom:1.5rem; }
        .input-group label { display:block; font-weight:600; margin-bottom:0.5rem; color:var(--text-main); }
        .input-group input, .input-group textarea { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; background:#f8fafb; font-size:1rem; }
        .btn { background:var(--primary); color:#fff; border:none; padding:12px 24px; border-radius:8px; font-weight:600; cursor:pointer; width:100%; font-size:1rem; }
        .btn:hover { background:var(--primary-hover); }
        .result { margin-top:1.5rem; padding:1.5rem; border-radius:12px; background:#f1f5f9; border-left:4px solid var(--primary); font-family:'Courier New', monospace; white-space: pre-wrap; font-size: 1rem; }
        
        @media (max-width: 768px) {
            .sidebar { width:0; display:none; }
            .main-content { margin-left:0; padding:1.5rem; }
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <h2>Dictionary Projects</h2>
    <ul class="nav-list" id="nav-list"></ul>
</aside>

<main class="main-content">
    <div class="container" id="app-container">
        <div class="header">
            <h1 id="task-title">Select a Task</h1>
            <p id="task-desc">Choose a dictionary project from the sidebar.</p>
        </div>
        <div class="card">
            <div id="input-container"></div>
            <button class="btn" onclick="executeCurrentTask()" id="run-btn">Execute Dict Logic</button>
            <div class="result" id="result-display">Logs and outputs will appear here...</div>
        </div>
    </div>
</main>

<script>
    const tasks = [
        { id: 1, title: "Student Marks Dict", desc: "Store and retrieve marks (Key: Name, Value: Mark).", inputs: [{ label: "Entries (Name:Mark, Name:Mark)", type: "text", id: "d1" }, { label: "Search Name", type: "text", id: "q" }] },
        { id: 2, title: "Word Frequency", desc: "Count occurrences of each word.", inputs: [{ label: "Sentence", type: "text", id: "d1" }] },
        { id: 3, title: "Phonebook App", desc: "Manage contacts.", inputs: [{ label: "Search Prefix", type: "text", id: "q" }] },
        { id: 4, title: "Inventory System", desc: "Track stock (Product:Qty).", inputs: [{ label: "Stock Data (Apples:10, Oranges:5)", type: "text", id: "d1" }] },
        { id: 5, title: "Student Grade System", desc: "Map scores to grades via dict.", inputs: [{ label: "Scores (Alice:85, Bob:42)", type: "text", id: "d1" }] },
        { id: 6, title: "Employee Salary", desc: "Sum salaries from dict.", inputs: [{ label: "Employees (Dev:5000, PM:6000)", type: "text", id: "d1" }] },
        { id: 7, title: "Quiz App", desc: "Q&A dictionary lookup.", inputs: [{ label: "Question (1 or 2)", type: "number", id: "q" }] },
        { id: 8, title: "JSON-like Handler", desc: "Access nested dict data.", inputs: [{ label: "Search Key (name/age/city)", type: "text", id: "q" }] },
        { id: 9, title: "Login using Dict", desc: "Verify credentials (stored as key-value).", inputs: [{ label: "Username", type: "text", id: "u" }, { label: "Password", type: "text", id: "p" }] },
        { id: 10, title: "Product Catalog", desc: "Find price of item.", inputs: [{ label: "Catalog (Pen:2, Book:15)", type: "text", id: "d1" }, { label: "Item", type: "text", id: "q" }] },
        { id: 11, title: "Dict Sorting", desc: "Sort by keys or values.", inputs: [{ label: "Data (C:3, A:1, B:2)", type: "text", id: "d1" }] },
        { id: 12, title: "Char Count", desc: "Count every character frequency.", inputs: [{ label: "Text", type: "text", id: "d1" }] },
        { id: 13, title: "Contact Search", desc: "Search values by part of key.", inputs: [{ label: "Contacts (Sam:X, Dean:Y)", type: "text", id: "d1" }, { label: "Part of Name", type: "text", id: "q" }] },
        { id: 14, title: "Library Management", desc: "Check book availability.", inputs: [{ label: "Books (B1:Out, B2:In)", type: "text", id: "d1" }, { label: "Book ID", type: "text", id: "q" }] },
        { id: 15, title: "Key-Value Swap", desc: "Invert dictionary entries.", inputs: [{ label: "Dict (A:1, B:2)", type: "text", id: "d1" }] }
    ];

    let currentTaskId = 1;
    const navList = document.getElementById('nav-list');
    tasks.forEach(t => {
        const li = document.createElement('li');
        li.className = `nav-item ${t.id === 1 ? 'active' : ''}`;
        li.textContent = t.title;
        li.onclick = () => loadTask(t.id);
        navList.appendChild(li);
    });

    function loadTask(id) {
        currentTaskId = id;
        const task = tasks.find(t => t.id === id);
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        Array.from(navList.children).find(li => li.textContent === task.title).classList.add('active');
        document.getElementById('task-title').textContent = task.title;
        document.getElementById('task-desc').textContent = task.desc;
        const container = document.getElementById('input-container');
        container.innerHTML = '';
        task.inputs.forEach(inp => {
            const group = document.createElement('div');
            group.className = 'input-group';
            group.innerHTML = `<label>${inp.label}</label><input type="${inp.type}" id="${inp.id}">`;
            container.appendChild(group);
        });
        document.getElementById('result-display').textContent = 'Result will appear here...';
    }

    function executeCurrentTask() {
        const res = document.getElementById('result-display');
        const getVal = (id) => document.getElementById(id) ? document.getElementById(id).value : '';
        const d1_raw = getVal('d1').split(',').map(x => x.trim()).filter(x => x !== '');
        const q = getVal('q').trim();

        const parseDict = (arr) => {
            let d = {};
            arr.forEach(item => {
                let [k, v] = item.split(':').map(x => x.trim());
                if(k) d[k] = v;
            });
            return d;
        };

        let output = "";
        switch(currentTaskId) {
            case 1:
                let d1 = parseDict(d1_raw);
                output = `Dict: ${JSON.stringify(d1, null, 2)}\nSearch [${q}]: ${d1[q] || "Not Found"}`;
                break;
            case 2:
                let words = getVal('d1').toLowerCase().split(/\W+/).filter(x => x);
                let freq = {};
                words.forEach(w => freq[w] = (freq[w] || 0) + 1);
                output = `Frequency Table:\n${JSON.stringify(freq, null, 2)}`;
                break;
            case 3:
                let pb = {"Alice": "123-456", "Bob": "987-654", "Charlie": "555-010"};
                let match = Object.keys(pb).filter(k => k.toLowerCase().startsWith(q.toLowerCase()));
                output = match.length ? `Result:\n${match.map(k => `${k}: ${pb[k]}`).join('\n')}` : "No contacts found.";
                break;
            case 4:
                let inv = parseDict(d1_raw);
                output = `Current Stock:\n${JSON.stringify(inv, null, 2)}`;
                break;
            case 5:
                let sc = parseDict(d1_raw);
                let gr = {};
                Object.entries(sc).forEach(([n, s]) => {
                    let score = parseInt(s);
                    gr[n] = score >= 50 ? "PASS" : "FAIL";
                });
                output = `Grades:\n${JSON.stringify(gr, null, 2)}`;
                break;
            case 6:
                let sal = parseDict(d1_raw);
                let total = Object.values(sal).reduce((a, b) => a + (parseFloat(b) || 0), 0);
                output = `Total Payroll: $${total}`;
                break;
            case 7:
                let qa = {"1": "What is 2+2?: 4", "2": "Capital of France?: Paris"};
                output = qa[q] || "Pick 1 or 2.";
                break;
            case 8:
                let user = {"name": "Mas", "age": 25, "city": "NYC", "traits": ["AI", "Fast"]};
                output = `Key [${q}]: ${JSON.stringify(user[q] || "Invalid Key")}`;
                break;
            case 9:
                let creds = {"admin": "123", "user": "pass"};
                output = creds[getVal('u')] === getVal('p') ? "Login Granted." : "Invalid Credentials.";
                break;
            case 10:
                let cat = parseDict(d1_raw);
                output = cat[q] ? `Price of ${q}: $${cat[q]}` : "Item not in catalog.";
                break;
            case 11:
                let sd = parseDict(d1_raw);
                let sortedKeys = Object.keys(sd).sort();
                output = `Sorted by Key:\n${sortedKeys.map(k => `${k}: ${sd[k]}`).join('\n')}`;
                break;
            case 12:
                let t12 = getVal('d1');
                let c12 = {};
                for(let c of t12) c12[c] = (c12[c] || 0) + 1;
                output = `Char Freq:\n${JSON.stringify(c12, null, 2)}`;
                break;
            case 13:
                let contacts = parseDict(d1_raw);
                let matches = Object.entries(contacts).filter(([k,v]) => k.toLowerCase().includes(q.toLowerCase()));
                output = matches.map(([k,v]) => `${k} -> ${v}`).join('\n') || "No match.";
                break;
            case 14:
                let books = parseDict(d1_raw);
                output = `Status [${q}]: ${books[q] || "Unknown ID"}`;
                break;
            case 15:
                let original = parseDict(d1_raw);
                let inverted = {};
                Object.entries(original).forEach(([k,v]) => inverted[v] = k);
                output = `Inverted Dict:\n${JSON.stringify(inverted, null, 2)}`;
                break;
        }
        res.innerHTML = output;
    }
    loadTask(1);
</script>
</body>
</html>
