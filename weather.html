<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
</head>
<body>
 
    <h2>Simple Weather App</h2>
 
    <input type="text" id="city" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>
 
    <h3 id="result"></h3>
 
    <script>
    const apiKey = "47080d045ee64353812103027262503";

    async function getWeather() {
        const city = document.getElementById("city").value.trim();
        const result = document.getElementById("result");

        if (!city) {
            result.innerText = "Please enter a city name.";
            return;
        }

        // 1. Show loading state
        result.innerText = "Searching...";

        try {
            const response = await fetch(
                `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${city}&aqi=no`
            );

            // 2. Check for HTTP errors (like 404 or 401)
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || "City not found");
            }

            const data = await response.json();

            // 3. Display with better formatting
            result.style.whiteSpace = "pre-line"; // Respects new lines
            result.innerText = `
                City: ${data.location.name}, ${data.location.country}
                Temperature: ${data.current.temp_c}°C
                Condition: ${data.current.condition.text}
                Humidity: ${data.current.humidity}%
                Wind: ${data.current.wind_kph} kph
            `;
        } catch (error) {
            // 4. Catch both network and API errors
            result.innerText = "Error: " + error.message;
        }
    }
</script>
 
</body>
</html>
