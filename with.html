<!DOCTYPE html>
<html>
<head>
    <title>Modern Validation</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { display: block; margin-bottom: 10px; padding: 8px; width: 250px; }
        #error { color: red; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Form 2</h2>
    <form id="modernForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="pass" placeholder="Password">
        <div id="error">Password is needed!</div>
        <button type="submit">Submit</button>
    </form>

    <script>
        const form = document.getElementById('modernForm');
        
        // We attach the "listener" to the form element here
        form.addEventListener('submit', function(event) {
            const passValue = document.getElementById('pass').value;
            const errorDiv = document.getElementById('error');

            if (passValue.trim() === "") {
                // Prevents the page from refreshing (keeps Name/Email visible)
                event.preventDefault(); 
                errorDiv.style.display = "block";
            } else {
                alert("Form submitted!");
            }
        });
    </script>

</body>
</html>
